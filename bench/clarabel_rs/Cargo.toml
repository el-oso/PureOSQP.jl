[package]
name = "clarabel_rs_bench"
version = "0.1.0"
edition = "2021"
publish = false

# Comparison driver only, not a PureOSQP.jl dependency: see src/main.rs and
# docs/src/benchmarks.md for what this measures and how to rerun it.
[dependencies]
clarabel = { version = "0.11.1", default-features = false, features = ["faer-sparse", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
