name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Each package is tested on its own first: PureQPBase that it holds no algorithm and its
      # backends work, PureIPM the interior-point method with nothing else loaded. PureOSQP
      # then runs the operator-splitting suite and everything that compares the two, so its
      # test environment takes the other packages from this checkout.
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureQPBase
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureQPBase
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureIPM
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureIPM
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureOSQP
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureOSQP
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: PureOSQP/src,PureOSQP/ext,PureQPBase/src,PureQPBase/ext,PureIPM/src,PureIPM/ext
      - uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
